name: CI/CD

on:
  push:
    branches: [main]

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/cloud app

jobs:
  build-test-push:
    runs-on: ubuntu-latest
    steps:
      # 1. Checkout
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Install dependencies
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # 3. Run tests
      - name: Run tests
        run: python -m pytest -v

      # 4. Build Docker image
      - name: Build Docker image
        run: |
          docker build -t $IMAGE_NAME:latest -t $IMAGE_NAME:${{ github.sha }} .

      # 5. Push image
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push image
        run: |
          docker push $IMAGE_NAME:latest
          docker push $IMAGE_NAME:${{ github.sha }}

  deploy:
    needs: build-test-push
    runs-on: ubuntu-latest
    steps:
      # 6. Deploy: pull the pushed image and run it
      - name: Deploy container
        run: |
          docker pull $IMAGE_NAME:latest
          docker run -d --name cloud-app -p 5000:5000 $IMAGE_NAME:latest
          sleep 5

      - name: Check deployment
        run: |
          curl -s http://localhost:5000 | tee response.txt
          grep -q "Cloud Technologies" response.txt
